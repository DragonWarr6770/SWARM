<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MASTERR_SWARM // SENTIMENT_ARBITRAGE v2.3</title>
    <style>
        :root {
            --stable-brown: #8B5A2B;
            --stable-green: #2E8B57;
            --data-cyan: #00f2ff;
            --terminal-black: #0A0A0A;
            --accent-gold: #D4AF37;
            --bull-green: #00ff88;
            --bear-red: #ff3366;
        }

        * { box-sizing: border-box; }

        body, html {
            margin: 0; padding: 0;
            background: var(--terminal-black);
            color: var(--data-cyan); 
            font-family: 'Consolas', 'Courier New', monospace;
            height: 100vh; 
            overflow: hidden; 
            display: flex; 
            flex-direction: column;
        }

        header {
            padding: 12px 20px; 
            border-bottom: 3px solid var(--stable-brown);
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            background: linear-gradient(to right, rgba(139, 90, 43, 0.15), rgba(10,10,10,0.95));
            box-shadow: 0 4px 15px rgba(139, 90, 43, 0.3);
            flex-wrap: wrap;
            gap: 10px;
        }

        .logo {
            font-size: 1.25rem;
            font-weight: bold;
            letter-spacing: 3px;
            color: var(--accent-gold);
            text-shadow: 0 0 10px var(--accent-gold);
        }

        .status {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 0.85rem;
        }

        .pulse { 
            animation: pulse-kf 2.5s infinite; 
        }
        @keyframes pulse-kf { 
            0%, 100% { opacity: 1; } 
            50% { opacity: 0.4; } 
        }

        main { 
            flex: 1; 
            display: grid; 
            grid-template-columns: 380px 1fr; 
            overflow: hidden;
        }

        #feed-control {
            border-right: 2px solid var(--stable-brown);
            padding: 20px;
            display: flex; 
            flex-direction: column; 
            gap: 20px;
            background: rgba(20, 20, 20, 0.95);
            overflow-y: auto;
        }

        #visualization-zone {
            padding: 15px; 
            display: flex; 
            flex-direction: column; 
            gap: 15px;
            background: radial-gradient(circle at center, #1a1a1a 0%, #050505 100%);
            overflow: hidden;
        }

        .data-card {
            background: rgba(255, 255, 255, 0.04); 
            border: 1px solid var(--stable-brown);
            padding: 16px; 
            margin-bottom: 12px; 
            transition: all 0.4s ease;
            border-radius: 4px;
        }

        .data-card:hover { 
            border-color: var(--accent-gold); 
            background: rgba(212, 175, 55, 0.08);
        }

        .sentiment-badge {
            font-size: 10px; 
            padding: 4px 10px; 
            border-radius: 2px;
            text-transform: uppercase; 
            font-weight: bold;
        }

        .bullish { color: var(--bull-green); border: 1px solid var(--bull-green); }
        .bearish { color: var(--bear-red); border: 1px solid var(--bear-red); }

        button {
            background: var(--stable-brown); 
            color: white; 
            border: none;
            padding: 12px 20px; 
            cursor: pointer; 
            font-family: inherit; 
            font-weight: bold;
            letter-spacing: 1px;
            transition: all 0.3s;
            text-transform: uppercase;
            font-size: 0.9rem;
        }

        button:hover {
            background: var(--accent-gold);
            color: black;
            transform: scale(1.03);
        }

        #heat-map-container {
            border-bottom: 2px solid var(--stable-brown); 
            background: rgba(0,0,0,0.3);
            border-radius: 4px;
            padding: 12px;
        }

        #heat-map {
            height: 160px; 
            display: flex; 
            align-items: flex-end; 
            gap: 5px;
            overflow-x: auto;
            padding: 10px 5px;
            scroll-behavior: smooth;
        }

        .bar { 
            width: 16px;
            min-width: 16px;
            transition: height 0.6s ease; 
            border-radius: 3px 3px 0 0;
        }

        #feed-results { 
            flex: 1; 
            overflow-y: auto;
            padding-right: 8px;
        }

        .scroll-top {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: var(--stable-brown);
            color: white;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(139, 90, 43, 0.5);
            z-index: 1000;
            border: 2px solid var(--accent-gold);
        }

        .section-title {
            color: var(--accent-gold);
            font-size: 0.9rem;
            letter-spacing: 2px;
            margin-bottom: 8px;
        }

        .stable-label { font-size: 12px; color: var(--stable-green); }

        /* =============== MOBILE RESPONSIVE =============== */
        @media (max-width: 900px) {
            main {
                grid-template-columns: 1fr;
            }
            #feed-control {
                border-right: none;
                border-bottom: 2px solid var(--stable-brown);
                max-height: 45vh;
            }
            header {
                padding: 10px 15px;
            }
            .logo {
                font-size: 1.1rem;
            }
        }

        @media (max-width: 600px) {
            #visualization-zone {
                padding: 10px;
            }
            .data-card {
                padding: 14px;
            }
            button {
                padding: 12px 16px;
                font-size: 0.85rem;
            }
            #heat-map {
                height: 130px;
            }
            .bar {
                width: 12px;
                min-width: 12px;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">MASTERR_SWARM // STABLE v2.3</div>
        <div class="status">
            <span class="pulse" style="color: var(--stable-green)">● LIVE</span>
            <span id="node-count" style="font-size: 0.85rem; opacity: 0.8;">NODES: 0</span>
        </div>
    </header>

    <main>
        <section id="feed-control">
            <div>
                <div class="section-title">TARGET NETWORK</div>
                <select id="rss-source" style="background:#111; color:var(--data-cyan); padding:12px 15px; border:2px solid var(--stable-brown); width:100%; font-family:inherit;">
                    <option value="https://hnrss.org/frontpage">HACKER_NEWS — Tech &amp; Innovation</option>
                    <option value="https://www.reddit.com/r/worldnews/.rss">WORLD_NEWS — Macro Sentiment</option>
                    <option value="https://search.cnbc.com/rs/search/all/view.rss?partnerId=2000&keywords=crypto">CNBC_CRYPTO — Market Heat</option>
                    <option value="https://rss.nytimes.com/services/xml/rss/nyt/Technology.xml">NYT_TECH — Quality Intel</option>
                    <option value="https://feeds.bloomberg.com/markets/news.rss">BLOOMBERG — Finance Pulse</option>
                </select>
            </div>

            <div style="display:flex; gap:12px;">
                <button onclick="Swarm.fetch()" style="flex:1;">ENGAGE SWARM</button>
                <button onclick="Swarm.clearFeed()" style="background:#333; flex:0.6;">RESET</button>
            </div>

            <div class="data-card">
                <div class="section-title">SCROLL CONTROLS</div>
                <div style="display:flex; align-items:center; gap:12px; flex-wrap:wrap;">
                    <label style="display:flex; align-items:center; gap:8px; font-size:0.9rem;">
                        <input type="checkbox" id="auto-scroll-toggle" onchange="Swarm.toggleAutoScroll()" checked>
                        AUTO-SCROLL
                    </label>
                </div>
                <div style="margin-top:12px; display:flex; gap:8px;">
                    <button onclick="Swarm.scrollToTop()" style="padding:10px 16px; flex:1;">↑ TOP</button>
                    <button onclick="Swarm.scrollToBottom()" style="padding:10px 16px; flex:1;">↓ BOTTOM</button>
                </div>
            </div>

            <div id="stats" style="font-size: 13px; line-height: 1.7; background:rgba(0,0,0,0.4); padding:16px; border:1px solid var(--stable-brown);">
                <div><span class="stable-label">SCAN_DEPTH:</span> 50_NODES</div>
                <div><span class="stable-label">LATENCY:</span> <span id="latency">~38ms</span></div>
                <div><span class="stable-label">SENTIMENT_BIAS:</span> <span id="bias-val" style="font-weight:bold;">NEUTRAL</span></div>
                <div><span class="stable-label">STABILITY:</span> <span style="color:var(--stable-green)">SOLID</span></div>
            </div>
        </section>

        <section id="visualization-zone">
            <div id="heat-map-container">
                <div id="heat-map"></div>
            </div>

            <div id="feed-results">
                <div style="text-align:center; margin-top:80px; opacity:0.7; font-size:1.1rem;">
                    STABLE AWAITING SIGNAL...<br>
                    <span style="font-size:0.85rem;">Select source and ENGAGE SWARM</span>
                </div>
            </div>
        </section>
    </main>

    <div onclick="Swarm.scrollToTop()" class="scroll-top" id="scrollBtn" style="display:none;">↑</div>

    <script>
        const Swarm = {
            autoScrollEnabled: true,

            async fetch() {
                const source = document.getElementById('rss-source').value;
                const resultsCont = document.getElementById('feed-results');
                
                resultsCont.innerHTML = `
                    <div style="text-align:center; padding:60px 20px; opacity:0.8;">
                        <div class="pulse" style="font-size:1.3rem; margin-bottom:15px;">INTERCEPTING FEED...</div>
                    </div>`;

                try {
                    const resp = await fetch(`https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(source)}`);
                    if (!resp.ok) throw new Error('Feed unavailable');
                    const data = await resp.json();
                    this.process(data.items || []);
                } catch (e) {
                    resultsCont.innerHTML = `
                        <div style="color:#ff6666; text-align:center; padding:40px;">
                            CONNECTION ERROR<br>
                            <button onclick="Swarm.fetch()" style="margin-top:15px;">RETRY</button>
                        </div>`;
                }
            },

            process(items) {
                const resultsCont = document.getElementById('feed-results');
                const heatMap = document.getElementById('heat-map');
                resultsCont.innerHTML = '';
                heatMap.innerHTML = '';

                if (!items || items.length === 0) {
                    resultsCont.innerHTML = '<div style="text-align:center; padding:60px; opacity:0.6;">No items received.</div>';
                    return;
                }

                let totalScore = 0;

                items.slice(0, 60).forEach(item => {
                    const score = this.analyze(item.title + " " + (item.content || item.description || ''));
                    totalScore += score;

                    const card = document.createElement('div');
                    card.className = 'data-card';
                    const vibeClass = score >= 1 ? 'bullish' : (score <= -1 ? 'bearish' : '');
                    const vibeText = score >= 1 ? 'BULLISH' : (score <= -1 ? 'BEARISH' : 'NEUTRAL');

                    card.innerHTML = `
                        <div style="display:flex; justify-content:space-between; margin-bottom:10px;">
                            <span class="sentiment-badge ${vibeClass}">${vibeText}</span>
                            <span style="font-size:10px; opacity:0.6;">${new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}</span>
                        </div>
                        <div style="font-weight:600; line-height:1.35;">${item.title}</div>
                        <a href="${item.link || '#'}" target="_blank" style="color:var(--accent-gold); font-size:10px; text-decoration:none; margin-top:8px; display:inline-block;">
                            [VIEW SOURCE]
                        </a>
                    `;
                    resultsCont.appendChild(card);

                    const bar = document.createElement('div');
                    bar.className = 'bar';
                    const height = Math.min(Math.abs(score) * 35 + 25, 150);
                    bar.style.height = `${height}px`;
                    bar.style.background = score >= 0 ? 'var(--bull-green)' : 'var(--bear-red)';
                    bar.title = `${item.title} | Score: ${score}`;
                    heatMap.appendChild(bar);
                });

                const finalBias = totalScore > 10 ? 'BULLISH' : (totalScore < -10 ? 'BEARISH' : 'NEUTRAL');
                const biasEl = document.getElementById('bias-val');
                biasEl.innerText = finalBias;
                biasEl.style.color = totalScore > 10 ? 'var(--bull-green)' : (totalScore < -10 ? 'var(--bear-red)' : '#aaa');

                document.getElementById('node-count').textContent = `NODES: ${items.length}`;

                if (this.autoScrollEnabled) {
                    setTimeout(() => this.scrollToBottom(), 150);
                }
            },

            analyze(text) {
                const pos = ['growth','up','launch','success','profit','surge','win','bull','ai','breakthrough','gain','rise','rally','strong','boost','innovat'];
                const neg = ['drop','fail','loss','crisis','down','risk','bear','crash','scam','fall','decline','fear','recession'];
                let score = 0;
                const words = text.toLowerCase().split(/\W+/);
                words.forEach(w => {
                    if (pos.includes(w)) score += 1.8;
                    if (neg.includes(w)) score -= 1.8;
                });
                return Math.round(score);
            },

            clearFeed() {
                document.getElementById('feed-results').innerHTML = `
                    <div style="text-align:center; margin-top:100px; opacity:0.6;">
                        FEED CLEARED<br>
                        <span style="font-size:0.85rem;">Ready for new signals</span>
                    </div>`;
                document.getElementById('heat-map').innerHTML = '';
                document.getElementById('bias-val').innerText = 'NEUTRAL';
            },

            toggleAutoScroll() {
                this.autoScrollEnabled = !this.autoScrollEnabled;
            },

            scrollToTop() {
                document.getElementById('feed-results').scrollTo({ top: 0, behavior: 'smooth' });
            },

            scrollToBottom() {
                const feed = document.getElementById('feed-results');
                feed.scrollTo({ top: feed.scrollHeight, behavior: 'smooth' });
            }
        };

        function setupScrollButton() {
            const feed = document.getElementById('feed-results');
            const btn = document.getElementById('scrollBtn');
            feed.addEventListener('scroll', () => {
                btn.style.display = feed.scrollTop > 300 ? 'flex' : 'none';
            });
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Home') Swarm.scrollToTop();
            if (e.key === 'End') Swarm.scrollToBottom();
        });

        window.onload = () => {
            setupScrollButton();
        };
    </script>
</body>
</html>
