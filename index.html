<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="manifest" href="./manifest.json">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MASTERR_SWARM // SENTIMENT_ARBITRAGE v2.2</title>
    <style>
        :root {
            --stable-brown: #8B5A2B;
            --stable-green: #2E8B57;
            --data-cyan: #00f2ff;
            --terminal-black: #0A0A0A;
            --accent-gold: #D4AF37;
            --bull-green: #00ff88;
            --bear-red: #ff3366;
        }

        body, html {
            margin: 0; padding: 0; 
            background: var(--terminal-black);
            color: var(--data-cyan); 
            font-family: 'Consolas', 'Courier New', monospace;
            height: 100vh; 
            overflow: hidden; 
            display: flex; 
            flex-direction: column;
        }

        header {
            padding: 15px 30px; 
            border-bottom: 3px solid var(--stable-brown);
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            background: linear-gradient(to right, rgba(139, 90, 43, 0.15), rgba(10,10,10,0.95));
            box-shadow: 0 4px 15px rgba(139, 90, 43, 0.3);
        }

        .logo {
            font-size: 1.4rem;
            font-weight: bold;
            letter-spacing: 3px;
            color: var(--accent-gold);
            text-shadow: 0 0 10px var(--accent-gold);
        }

        .status {
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 0.9rem;
        }

        .pulse { 
            animation: pulse-kf 2.5s infinite; 
        }
        @keyframes pulse-kf { 
            0%, 100% { opacity: 1; } 
            50% { opacity: 0.4; } 
        }

        main { 
            display: grid; 
            grid-template-columns: 380px 1fr; 
            flex: 1; 
            overflow: hidden; 
        }

        #feed-control {
            border-right: 2px solid var(--stable-brown);
            padding: 25px;
            display: flex; 
            flex-direction: column; 
            gap: 25px;
            background: rgba(20, 20, 20, 0.95);
            overflow-y: auto;
        }

        #visualization-zone {
            padding: 25px; 
            display: flex; 
            flex-direction: column; 
            gap: 20px;
            background: radial-gradient(circle at center, #1a1a1a 0%, #050505 100%);
            position: relative;
            overflow: hidden;
        }

        .data-card {
            background: rgba(255, 255, 255, 0.04); 
            border: 1px solid var(--stable-brown);
            padding: 18px; 
            margin-bottom: 15px; 
            transition: all 0.4s ease;
            border-radius: 4px;
        }

        .data-card:hover { 
            border-color: var(--accent-gold); 
            background: rgba(212, 175, 55, 0.08);
            transform: translateY(-3px);
        }

        .sentiment-badge {
            font-size: 11px; 
            padding: 4px 10px; 
            border-radius: 2px;
            text-transform: uppercase; 
            font-weight: bold;
            letter-spacing: 1px;
        }

        .bullish { 
            color: var(--bull-green); 
            border: 1px solid var(--bull-green); 
        }
        .bearish { 
            color: var(--bear-red); 
            border: 1px solid var(--bear-red); 
        }

        button {
            background: var(--stable-brown); 
            color: white; 
            border: none;
            padding: 14px 24px; 
            cursor: pointer; 
            font-family: inherit; 
            font-weight: bold;
            letter-spacing: 1px;
            transition: all 0.3s;
            text-transform: uppercase;
        }

        button:hover {
            background: var(--accent-gold);
            color: black;
            transform: scale(1.03);
        }

        /* Enhanced Heat Map with Horizontal Scroll */
        #heat-map-container {
            border-bottom: 2px solid var(--stable-brown); 
            padding-bottom: 15px;
            background: rgba(0,0,0,0.3);
            border-radius: 4px;
            position: relative;
        }

        #heat-map {
            height: 180px; 
            display: flex; 
            align-items: flex-end; 
            gap: 6px;
            overflow-x: auto;
            overflow-y: hidden;
            padding: 15px 10px;
            scroll-behavior: smooth;
            scrollbar-width: thin;
            scrollbar-color: var(--stable-brown) #222;
        }

        #heat-map::-webkit-scrollbar {
            height: 8px;
        }
        
        #heat-map::-webkit-scrollbar-thumb {
            background: var(--stable-brown);
            border-radius: 4px;
        }

        .bar { 
            width: 18px;
            min-width: 18px;
            transition: height 0.6s cubic-bezier(0.4, 0, 0.2, 1), background 0.3s; 
            border-radius: 3px 3px 0 0;
            position: relative;
        }

        .bar:hover {
            filter: brightness(1.3);
        }

        #feed-results { 
            flex: 1; 
            overflow-y: auto;
            padding-right: 10px;
            scroll-behavior: smooth;
        }

        #feed-results::-webkit-scrollbar {
            width: 8px;
        }
        
        #feed-results::-webkit-scrollbar-thumb {
            background: var(--stable-brown);
            border-radius: 4px;
        }

        .scroll-top {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: var(--stable-brown);
            color: white;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(139, 90, 43, 0.4);
            transition: all 0.3s;
            z-index: 100;
            border: 2px solid var(--accent-gold);
        }

        .scroll-top:hover {
            background: var(--accent-gold);
            color: black;
            transform: translateY(-5px);
        }

        .section-title {
            color: var(--accent-gold);
            font-size: 0.95rem;
            letter-spacing: 2px;
            margin-bottom: 8px;
            border-bottom: 1px dashed var(--stable-brown);
            padding-bottom: 5px;
        }

        .stable-label {
            font-size: 12px;
            color: var(--stable-green);
        }

        /* New controls */
        .toggle-switch {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.85rem;
        }

        .toggle {
            position: relative;
            display: inline-block;
            width: 48px;
            height: 24px;
        }

        .toggle input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #333;
            transition: .3s;
            border-radius: 24px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .3s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: var(--bull-green);
        }

        input:checked + .slider:before {
            transform: translateX(24px);
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">MASTERR_SWARM // STABLE v2.2</div>
        <div class="status">
            <span class="pulse" style="color: var(--stable-green)">● STABLE CONNECTION</span>
            <span id="node-count" style="font-size: 0.85rem; opacity: 0.8;">NODES: 0</span>
        </div>
    </header>

    <main>
        <section id="feed-control">
            <div>
                <div class="section-title">TARGET NETWORK</div>
                <select id="rss-source" style="background:#111; color:var(--data-cyan); padding:12px 15px; border:2px solid var(--stable-brown); width:100%; font-family:inherit;">
                    <option value="https://hnrss.org/frontpage">HACKER_NEWS — Tech &amp; Innovation</option>
                    <option value="https://www.reddit.com/r/worldnews/.rss">WORLD_NEWS — Macro Sentiment</option>
                    <option value="https://search.cnbc.com/rs/search/all/view.rss?partnerId=2000&keywords=crypto">CNBC_CRYPTO — Market Heat</option>
                    <option value="https://rss.nytimes.com/services/xml/rss/nyt/Technology.xml">NYT_TECH — Quality Intel</option>
                    <option value="https://feeds.bloomberg.com/markets/news.rss">BLOOMBERG — Finance Pulse</option>
                </select>
            </div>

            <div style="display:flex; gap:12px; flex-wrap: wrap;">
                <button onclick="Swarm.fetch()" style="flex:1;">ENGAGE SWARM</button>
                <button onclick="Swarm.clearFeed()" style="background:#333; flex:0.6;">RESET</button>
            </div>

            <!-- New Scroll Controls -->
            <div class="data-card">
                <div class="section-title">SCROLL CONTROLS v2</div>
                <div class="toggle-switch">
                    <label class="toggle">
                        <input type="checkbox" id="auto-scroll-toggle" onchange="Swarm.toggleAutoScroll()">
                        <span class="slider"></span>
                    </label>
                    <span>AUTO-SCROLL FEED</span>
                </div>
                <div style="margin-top:12px; font-size:11px; opacity:0.7;">
                    <button onclick="Swarm.scrollToTop()" style="padding:8px 16px; font-size:0.8rem;">↑ TOP</button>
                    <button onclick="Swarm.scrollToBottom()" style="padding:8px 16px; font-size:0.8rem; margin-left:8px;">↓ BOTTOM</button>
                </div>
            </div>

            <div id="stats" style="font-size: 12px; line-height: 1.8; background:rgba(0,0,0,0.4); padding:15px; border:1px solid var(--stable-brown);">
                <div><span class="stable-label">SCAN_DEPTH:</span> 50_NODES</div>
                <div><span class="stable-label">LATENCY:</span> <span id="latency">~38ms</span></div>
                <div><span class="stable-label">SENTIMENT_BIAS:</span> <span id="bias-val" style="font-weight:bold;">NEUTRAL</span></div>
                <div><span class="stable-label">STABILITY:</span> <span style="color:var(--stable-green)">SOLID</span></div>
            </div>

            <div style="margin-top:auto; font-size:11px; opacity:0.6;">
                HORSE STABLE PROTOCOL<br>
                <span style="color:var(--accent-gold)">SENTIMENT ARBITRAGE ENGINE v2.2</span>
            </div>
        </section>

        <section id="visualization-zone">
            <div id="heat-map-container">
                <div id="heat-map">
                    <!-- JS populated - now horizontally scrollable -->
                </div>
            </div>

            <div id="feed-results">
                <div style="text-align:center; margin-top:120px; opacity:0.6; font-size:1.1rem;">
                    STABLE AWAITING SIGNAL...<br>
                    <span style="font-size:0.8rem;">Select source and ENGAGE</span>
                </div>
            </div>
        </section>
    </main>

    <!-- Scroll to top button -->
    <div onclick="Swarm.scrollToTop()" class="scroll-top" id="scrollBtn" style="display:none;">
        ↑
    </div>

    <script>
        const Swarm = {
            autoScrollEnabled: false,
            lastScrollHeight: 0,

            async fetch() {
                const source = document.getElementById('rss-source').value;
                const resultsCont = document.getElementById('feed-results');
                resultsCont.innerHTML = `
                    <div style="text-align:center; padding:60px 20px; opacity:0.8;">
                        <div class="pulse" style="font-size:1.3rem; margin-bottom:15px;">INTERCEPTING STABLE FEED...</div>
                        <div style="font-size:0.9rem; color:#888;">Analyzing market horses...</div>
                    </div>`;

                try {
                    const resp = await fetch(`https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(source)}`);
                    if (!resp.ok) throw new Error('Feed unavailable');
                    const data = await resp.json();
                    this.process(data.items || []);
                } catch (e) {
                    resultsCont.innerHTML = `
                        <div style="color:#ff6666; text-align:center; padding:40px;">
                            STABLE DISRUPTION<br>
                            <span style="font-size:0.85rem; opacity:0.7;">${e.message}</span><br><br>
                            <button onclick="Swarm.fetch()" style="background:#8B5A2B; padding:10px 20px;">RETRY</button>
                        </div>`;
                }
            },

            process(items) {
                const resultsCont = document.getElementById('feed-results');
                const heatMap = document.getElementById('heat-map');
                resultsCont.innerHTML = '';
                heatMap.innerHTML = '';

                if (!items || items.length === 0) {
                    resultsCont.innerHTML = '<div style="text-align:center; padding:50px; opacity:0.6;">No items received from source.</div>';
                    return;
                }

                let totalScore = 0;
                let positiveCount = 0;

                // Process more items in v2.2
                items.slice(0, 50).forEach((item, index) => {
                    const score = this.analyze(item.title + " " + (item.content || item.description || ''));
                    totalScore += score;
                    if (score > 0) positiveCount++;

                    const card = document.createElement('div');
                    card.className = 'data-card';
                    const vibeClass = score >= 1 ? 'bullish' : (score <= -1 ? 'bearish' : '');
                    const vibeText = score >= 1 ? 'BULLISH' : (score <= -1 ? 'BEARISH' : 'NEUTRAL');

                    card.innerHTML = `
                        <div style="display:flex; justify-content:space-between; margin-bottom:12px; align-items:center;">
                            <span class="sentiment-badge ${vibeClass}">${vibeText}</span>
                            <span style="font-size:10px; opacity:0.6;">${new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}</span>
                        </div>
                        <div style="font-weight:600; line-height:1.3; margin-bottom:8px;">${item.title}</div>
                        <a href="${item.link || '#'}" target="_blank" style="color:var(--accent-gold); font-size:10px; text-decoration:none; display:inline-block;">
                            [VIEW SOURCE NODE]
                        </a>
                    `;
                    resultsCont.appendChild(card);

                    // Heat bar - fixed width for horizontal scroll
                    const bar = document.createElement('div');
                    bar.className = 'bar';
                    const height = Math.min(Math.abs(score) * 38 + 22, 160);
                    bar.style.height = `${height}px`;
                    bar.style.background = score >= 0 ? 'var(--bull-green)' : 'var(--bear-red)';
                    bar.title = `${item.title} | Score: ${score}`;
                    heatMap.appendChild(bar);
                });

                const finalBias = totalScore > 8 ? 'BULLISH' : (totalScore < -8 ? 'BEARISH' : 'NEUTRAL');
                const biasEl = document.getElementById('bias-val');
                biasEl.innerText = finalBias;
                biasEl.style.color = totalScore > 8 ? 'var(--bull-green)' : (totalScore < -8 ? 'var(--bear-red)' : '#aaa');

                document.getElementById('node-count').textContent = `NODES: ${items.length}`;

                // Auto-scroll to bottom after new data
                if (this.autoScrollEnabled) {
                    setTimeout(() => this.scrollToBottom(), 100);
                }
            },

            analyze(text) {
                const pos = ['growth', 'up', 'launch', 'success', 'profit', 'surge', 'new', 'win', 'bull', 'future', 'ai', 'breakthrough', 'gain', 'rise', 'rally', 'strong', 'boost', 'innovat', 'record'];
                const neg = ['drop', 'fail', 'loss', 'crisis', 'down', 'risk', 'bear', 'warning', 'sue', 'hack', 'crash', 'scam', 'fall', 'decline', 'fear', 'recession', 'plunge', 'slump'];
                
                let score = 0;
                const words = text.toLowerCase().split(/\W+/);
                words.forEach(w => {
                    if (pos.includes(w)) score += 1.8;
                    if (neg.includes(w)) score -= 1.8;
                });
                return Math.round(score);
            },

            clearFeed() {
                document.getElementById('feed-results').innerHTML = `
                    <div style="text-align:center; margin-top:120px; opacity:0.6; font-size:1.1rem;">
                        FEED CLEARED<br>
                        <span style="font-size:0.85rem;">Ready for new signals</span>
                    </div>`;
                document.getElementById('heat-map').innerHTML = '';
                document.getElementById('bias-val').innerText = 'NEUTRAL';
                document.getElementById('bias-val').style.color = '#aaa';
            },

            toggleAutoScroll() {
                this.autoScrollEnabled = !this.autoScrollEnabled;
            },

            scrollToTop() {
                document.getElementById('feed-results').scrollTo({
                    top: 0,
                    behavior: 'smooth'
                });
            },

            scrollToBottom() {
                const feed = document.getElementById('feed-results');
                feed.scrollTo({
                    top: feed.scrollHeight,
                    behavior: 'smooth'
                });
            }
        };

        // Scroll button visibility
        function setupScrollButton() {
            const feed = document.getElementById('feed-results');
            const scrollBtn = document.getElementById('scrollBtn');
            
            feed.addEventListener('scroll', () => {
                if (feed.scrollTop > 400) {
                    scrollBtn.style.display = 'flex';
                } else {
                    scrollBtn.style.display = 'none';
                }
            });
        }

        // Keyboard support
        document.addEventListener('keydown', (e) => {
            if (e.key === '/' && document.getElementById('rss-source') !== document.activeElement) {
                document.getElementById('rss-source').focus();
                e.preventDefault();
            }
            if (e.key === 'End') Swarm.scrollToBottom();
            if (e.key === 'Home') Swarm.scrollToTop();
        });

        // Initialize
        window.onload = () => {
            setupScrollButton();
            
            // Demo: auto load one feed after 800ms
            setTimeout(() => {
                // Swarm.fetch(); // Uncomment if you want auto-load on start
            }, 800);
        };
    </script>
</body>
</html>
